<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Change Password</title><link rel="stylesheet" href="/static/style.css"></head><body><main class="wrap narrow"><div class="card"><h2>Change Admin Password</h2><p>First login par temporary password ko strong password se replace karein.</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for cat,msg in messages %}<div class="alert {{cat}}">{{msg}}</div>{% endfor %}{% endwith %}<form method="post"><label>New password<input type="password" name="new_password" minlength="10" required autocomplete="new-password"></label><label>Confirm password<input type="password" name="confirm_password" minlength="10" required autocomplete="new-password"></label><button class="btn">Save Password</button></form></div></main></body></html>
