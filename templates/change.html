<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Change Password</title><link rel="stylesheet" href="/static/style.css"></head><body><main class="wrap"><div class="card narrow"><h1>Change Admin Password</h1>{% with messages=get_flashed_messages(with_categories=true) %}{% for cat,msg in messages %}<div class="alert {{cat}}">{{msg}}</div>{% endfor %}{% endwith %}<form method="post"><label>New Password<input name="new_password" type="password" minlength="10" required></label><label>Confirm Password<input name="confirm_password" type="password" minlength="10" required></label><button class="btn">Change Password</button></form></div></main></body></html>
